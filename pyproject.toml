[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studytrack"
version = "0.1.0"
description = "StudyTrack - Build a Better You"
authors = [
    { name = "StudyTrack Team" }
]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pyqtgraph>=0.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=6.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
